name: Build QUICK BUTTON X

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract single ZIP source
        run: unzip -q QUICK_BUTTON_X_GITHUB_PROJECT.zip -d project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: cd project && gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUICK-BUTTON-X-APK-v1.3
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
