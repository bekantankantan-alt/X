name: Build QUICK BUTTON X APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if present
        shell: bash
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP_FILE=$(find . -maxdepth 4 -type f -name 'QUICK_BUTTON_X_GITHUB_PROJECT.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -oq "$ZIP_FILE" -d .
            fi
          fi

      - name: Find Android project folder
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJECT_DIR=.
          else
            SETTINGS_FILE=$(find . -maxdepth 6 -type f -name 'settings.gradle' | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE=$(find . -maxdepth 6 -type f -name 'settings.gradle.kts' | head -n 1)
            fi
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle tidak ditemukan. Ekstrak isi ZIP project ke repository GitHub."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUICK_BUTTON_X_APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
