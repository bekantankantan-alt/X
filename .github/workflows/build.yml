name: Build QUICK BUTTON X APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -name 'QUICK_BUTTON_X_GITHUB_PROJECT.zip' -print -quit)"
            if [ -n "$ZIP_FILE" ]; then
              unzip -oq "$ZIP_FILE" -d .
            fi
          fi

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            SETTINGS_FILE="$(find . -maxdepth 5 -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle tidak ditemukan. Upload isi ZIP project (ekstrak), atau simpan ZIP project di repository."
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUICK_BUTTON_X_APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
